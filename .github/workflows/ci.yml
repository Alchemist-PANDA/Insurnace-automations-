name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stl
          POSTGRES_PASSWORD: stl
          POSTGRES_DB: stl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stl -d stl"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Services (and the test run) connect as the restricted app role so RLS
      # is actually exercised. Migrations run as the owner.
      DATABASE_URL: postgres://stl_app:stl_app@localhost:5432/stl
      MIGRATION_DATABASE_URL: postgres://stl:stl@localhost:5432/stl
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-at-least-sixteen-chars
      CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key-base64==

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm lint
      # Generate + apply migrations and RLS, then bootstrap the app role,
      # connecting as the owner.
      - run: DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm db:migrate
      - run: pnpm test
