name: Deploy

# Continuous delivery (plan: architecture §8). Builds images, runs migrations
# as a gated step, then deploys. Fill in the deploy step for your target
# (Fly.io / Render / ECS). Migrations run BEFORE the new code goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push images
        run: |
          for target in api worker web; do
            docker buildx build --target "$target" \
              -t "ghcr.io/${{ github.repository }}/$target:${{ github.sha }}" \
              --push .
          done

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # requires manual approval + holds prod secrets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - name: Run migrations (schema + RLS + app role)
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm db:migrate

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Replace with your platform's deploy action, e.g.:
      #   - uses: superfly/flyctl-actions/setup-flyctl@master
      #   - run: flyctl deploy --image ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - name: Deploy placeholder
        run: echo "Wire this to Fly.io / Render / ECS using the pushed image tags."
